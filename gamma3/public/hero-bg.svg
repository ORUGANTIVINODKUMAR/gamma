<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMaxYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf3fb"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe9f6"/>
      <stop offset="1" stop-color="#eaf3fb"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ddf0"/>
      <stop offset="1" stop-color="#e2eef9"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#4577a8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="win" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="11" height="15" fill="#ffffff" fill-opacity="0.7"/>
    </pattern>
    <pattern id="win2" width="18" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="9" height="13" fill="#ffffff" fill-opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- far skyline -->
  <g fill="url(#b1)">
    <rect x="640" y="520" width="90" height="380"/>
    <rect x="740" y="470" width="70" height="430"/>
    <rect x="820" y="560" width="110" height="340"/>
    <rect x="940" y="500" width="80" height="400"/>
    <rect x="1030" y="440" width="100" height="460"/>
    <rect x="1140" y="540" width="90" height="360"/>
    <rect x="1240" y="480" width="120" height="420"/>
    <rect x="1370" y="560" width="90" height="340"/>
    <rect x="1470" y="500" width="130" height="400"/>
  </g>

  <!-- near towers -->
  <g>
    <rect x="860" y="330" width="150" height="570" fill="url(#b2)"/>
    <rect x="860" y="330" width="150" height="570" fill="url(#win)"/>
    <rect x="1080" y="210" width="170" height="690" fill="url(#b2)"/>
    <rect x="1080" y="210" width="170" height="690" fill="url(#win2)"/>
    <path d="M1080 210 L1165 150 L1250 210 Z" fill="#c9ddf0"/>
    <rect x="1320" y="360" width="150" height="540" fill="url(#b2)"/>
    <rect x="1320" y="360" width="150" height="540" fill="url(#win)"/>
    <rect x="1500" y="290" width="120" height="610" fill="url(#b2)"/>
    <rect x="1500" y="290" width="120" height="610" fill="url(#win2)"/>
  </g>

  <!-- ground line -->
  <rect y="880" width="1600" height="20" fill="#dbe9f6"/>
</svg>
